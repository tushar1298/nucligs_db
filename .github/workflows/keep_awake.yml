name: Keep NucLigs Streamlit App Alive

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit App
        run: |
          echo "Pinging NucLigs app..."

          URL="https://nucligs.streamlit.app/"

          for i in {1..3}
          do
            echo "Attempt $i"

            HTTP_STATUS=$(curl -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --connect-timeout 30 \
              --max-time 120 \
              -o /dev/null \
              -s \
              -w "%{http_code}" \
              "$URL")

            echo "HTTP Status: $HTTP_STATUS"

            # Success
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "App is awake."
              exit 0
            fi

            echo "Waiting before retry..."
            sleep 40
          done

          echo "Finished keep-alive ping."

      - name: Done
        run: echo "Workflow completed."
